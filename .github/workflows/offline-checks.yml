name: Offline source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python regression checks
        run: python3 -m unittest discover -s tests -v
      - name: Parse scripts without running boot operations
        run: |
          python3 -m py_compile tools/*.py
          sh -n rootfs-overlay/usr/sbin/rn07-boot-control
          sh -n rootfs-overlay/usr/sbin/rn07-return-stock
          sh -n rootfs-overlay/etc/init.d/rn07_boot
